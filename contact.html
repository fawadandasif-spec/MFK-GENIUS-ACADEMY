<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        nav {
            background-color: darkblue;
            padding: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 20px;
        }

        nav a:hover {
            color: yellow;
        }

        .contact {
            padding: 70px 20px;
        }

        h1 {
            color: darkblue;
            font-size: 50px;
        }

        .contact-box {
            background-color: white;
            width: 400px;
            max-width: 85%;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="courses.html">COURSES</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <div class="contact">
        <p>📞 Contact Number: 0336 0500868</p>

        <div class="contact-box">
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <br>
            <button>Send Message</button>
        </div>
    </div>

</body>
</html>
